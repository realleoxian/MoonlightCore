plugins {
    id 'multiloader-loader'
    id 'fabric-loom'

    id 'com.modrinth.minotaur'
    id 'com.matthewprenger.cursegradle'
}

group = rootProject.group
version = rootProject.version
base.archivesName = "${modId}-fabric"

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${mcVersion}:${parchmentVersion}@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:${fabricLoaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}+${mcVersion}"

    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation project(":Xplat")
}

loom {
    if(project(":Xplat").file("src/main/resources/${modId}.accesswidener").exists()) {
        accessWidenerPath.set(project(":Xplat").file("src/main/resources/${modId}.accesswidener"))
    }

    mixin {
        defaultRefmapName.set("${modId}.refmap.json")
    }

    runs {
        client {
            client()

            configName = "FabricMC Client"
            runDir = "../run/client"
            ideConfigGenerated = true
        }

        server {
            server()

            configName = "FabricMC Server"
            runDir = "../run/server/fabric"
            ideConfigGenerated = true
        }
    }

    mods {
        "${modId}" {
            sourceSet sourceSets.main
        }
    }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = modrinthProjectId

    versionName = "[Fabric] MoonlightCore | ${mcVersion}-${version}"
    versionNumber = "${mcVersion}-${version}"
    versionType = "${releaseChannel}"

    if(rootProject.ext.changelogFile.exists()) {
        changelog = rootProject.ext.changelogFile.text
    }

    gameVersions = ["${mcVersion}"]
    loaders = ["fabric"]

    uploadFile = remapJar


    dependencies {
        required.project 'fabric-api'
    }
}

curseforge {
    apiKey = System.getenv("CURSEFORGE_API_KEY")

    project {
        id = "${curseforgeProjectId}"

        if(rootProject.ext.changelogFile.exists()) {
            changelog = rootProject.ext.changelogFile.text
        }

        releaseType = "${releaseChannel}"

        addGameVersion "Java ${modJavaVersion}"
        addGameVersion "Fabric"
        addGameVersion "${mcVersion}"

        mainArtifact(remapJar) {
            displayName = "[Fabric] MoonlightCore | ${mcVersion}-${version}"
        }

        relations {
            requiredDependency "fabric-api"
        }
    }
}