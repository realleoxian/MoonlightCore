plugins {
    id 'moonlightcore-loader'
    id 'net.fabricmc.fabric-loom-remap'
    id 'me.modmuss50.mod-publish-plugin'
}

dependencies {
    minecraft "com.mojang:minecraft:${project.mcVersion}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${mcVersion}:${parchmentVersion}@zip")
    }

    modImplementation("net.fabricmc:fabric-loader:${project.fabricLoaderVersion}")
    modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabricApiVersion}")
    modCompileOnly("me.lucko:fabric-permissions-api:${project.fabricPermissionApi}")

    include(implementation("com.google.code.findbugs:jsr305:3.0.2"))

    api(project(":Xplat"))
}

artifacts {
    archives(tasks.remapJar)
    archives(tasks.remapSourcesJar)
}

loom {
    accessWidenerPath = project(":Xplat").file("src/main/resources/moonlightcore.accesswidener")

    mods {
        "moonllightcore" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()

            configName = "Fabric Client"
            ideConfigGenerated = true
            runDir = "run/client"

            vmArg "-Dfabric.log.level=info"
        }
        server {
            server()

            configName = "Fabric Server"
            ideConfigGenerated = true
            runDir = "run/server"

            vmArg "-Dfabric.log.level=info"
        }
    }
}

import me.modmuss50.mpp.ReleaseType
publishMods {
    evaluationDependsOn(":Xplat")

    type = ReleaseType.of(modVersionType)
    displayName = "MoonlightCore | ${mcVersion}-${modVersion} | Fabric"
    changelog = provider {
        def changelogFile = rootProject.file("changelog/${mcVersion}/${modVersion}.${modVersionType}.md")
        return changelogFile.exists() ? changelogFile.text : "No Changelog Provided"
    }

    curseforge {
        accessToken = System.getenv("CURSEFORGE_API_KEY")
        projectId = "1152824"
        file project(":Fabric")
        modLoaders.add("fabric")
        minecraftVersions.add("${mcVersion}")
        javaVersions.add(JavaVersion.toVersion(modJavaVersion))
        dryRun = !System.getenv().containsKey("CURSEFORGE_API_KEY")

        requires {
            slug = "fabric-api"
        }
    }
    modrinth {
        accessToken = System.getenv("MODRINTH_TOKEN")
        projectId = "6MSffsOL"
        file project(":Fabric")
        modLoaders.add("fabric")
        minecraftVersions.add("${mcVersion}")
        additionalFiles.from project(":Xplat").jar
        dryRun = !System.getenv().containsKey("MODRINTH_TOKEN")

        requires {
            slug = "fabric-api"
        }
        optional {
            slug = "fabric-permissions-api"
        }
    }
}

publishing {
    publications {
        register("fabricJar", MavenPublication) {
            artifactId = base.archivesName.get()
            artifact(tasks.remapJar)
            artifact(tasks.remapSourcesJar)
        }
    }
    repositories {
        maven {
            url = "file://" + System.getenv("maven_local")
        }
    }
}
