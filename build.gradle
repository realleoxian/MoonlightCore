plugins {
    id 'com.modrinth.minotaur' version '2.+' apply false
    id 'com.matthewprenger.cursegradle' version '1.4.0' apply false

    id 'fabric-loom' version '1.10-SNAPSHOT' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.105' apply false
    // TODO: De-comment when updating to 1.21.0
//    id 'net.neoforged.moddev' version '2.0.105' apply false

    id 'idea'
}

if(releaseChannel != "release") {
    if(releaseChannel == "beta") {
        version += "-beta"
    } else if(releaseChannel == "alpha") {
        version += "-alpha"
    }
}

ext {
    changelogFile = rootProject.file("changelog/${version}/changelog.md")
}

idea.module {
    for(var excludeDirName in ["run", "out", "logs", "runs"]) {
        File excludeDir = new File(projectDir, excludeDirName)
        excludeDirs.add excludeDir
    }

    downloadSources = true
    inheritOutputDirs = false
}