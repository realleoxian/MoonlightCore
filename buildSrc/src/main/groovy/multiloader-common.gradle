plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
}

group = modGroup
version = modVersion
base {
    archivesName = "${modId}-${mcVersion}-${project.name}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(modJavaVersion)
        version = JvmVendorSpec.ADOPTIUM
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = 'NeoForge'
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "FabricMC"
                url = "https://maven.fabricmc.net/"
            }
        }
        filter {
            includeGroupAndSubgroups("net.fabricmc")
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups("org.spongepowered") }
    }
    mavenCentral()
}

tasks.named("sourcesJar", Jar) {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${modId}"}
    }
    archiveClassifier = "sources"
}

tasks.named('jar', Jar) {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${modId}"}
    }

    manifest {
        attributes([
                "Specification-Title": modId,
                "Specification-Vendor": modAuthor,
                "Specification-Version": modVersion,
                "Implementation-Title": project.name,
                "Implementation-Vendor": modAuthor,
                "Implementation-Version": jar.archiveVersion,
                "Built-On-Minecraft": mcVersion,
                "MixinConfigs": "${modId}.mixins.json,${modId}.${project.name}.mixins.json"
        ])
    }
}

tasks.withType(ProcessResources).configureEach {
    var expandedProperties = [
            modId: modId, modName: modName, modVersion: modVersion, modDescription: modDescription, modLicense: modLicense, modAuthor: modAuthor, modCredits: modCredits, modSources: modSources, modIssues: modIssues, modJavaVersion: modJavaVersion,
            mcVersion: mcVersion, packFormat: packFormat,
            fabricApi: fabricApi, fabricApiRange: fabricApiRange, fabricLoaderVersion: fabricLoaderVersion, fabricLoaderRange: fabricLoaderRange,
            neoVersion: neoVersion, neoRange: neoRange, neoLoaderRange: neoLoaderRange
    ]
    var jsonExpandedProperties = expandedProperties.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
    }

    filesMatching(["META-INF/neoforge.mods.toml"]) {
        expand expandedProperties
    }
    filesMatching(["fabric.mod.json", "pack.mcmeta"]) {
        expand jsonExpandedProperties
    }
    inputs.properties expandedProperties
}

tasks.withType(Javadoc).configureEach {
    failOnError = false
    var stdDocletOptions = options as StandardJavadocDocletOptions
    stdDocletOptions.addStringOption("-Xdoclint:none", "-quiet")
}

tasks.withType(JavaCompile).configureEach {
    javaToolchains {
        compilerFor {
            languageVersion = JavaLanguageVersion.of(modJavaVersion)
        }
    }
}

['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

publishing {
    publications {
        register("mavenJar", MavenPublication) {
            artifactId = "${modId}-${project.name}"
            version = project.version
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://" + System.getenv("maven_local")
        }
    }
}

idea {
    module {
        for (String directory in ["out", "logs", "runs", "build"]) {
            excludeDirs.add(file(directory))
        }
        downloadSources = true
        downloadJavadoc = true
    }
}