modLoader = "javafml"
loaderVersion = "${forgeLoaderVersionRange}"

license = "${modLicense}"
issueTrackerURL = "${modIssueTracker}"
showAsResourcePack = false
clientSideOnly = false

[[mods]]
    modId = "${modId}"
    version = "${modVersion}"
    displayName = "${modName}"
    description = "${modDescription}"
#    logoFile = "logo.png"
    authors = "${modAuthor}"
    credits = "${modCredits}"

        [[dependencies."${modId}"]]
            modId = "forge"
            mandatory = true
            versionRange = "${forgeVersionRange}"
            ordering = "NONE"
            side = "BOTH"