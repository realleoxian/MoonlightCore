plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'

    id 'com.modrinth.minotaur'
    id 'com.matthewprenger.cursegradle'
}

group = rootProject.group
version = rootProject.version
base.archivesName = "${modId}-forge"

mixin {
    add(sourceSets.main, "${modId}.refmap.json")

    config("${modId}.mixins.json")
    config("${modId}.forge.mixins.json")
}

legacyForge {
    version = "${mcVersion}-${forgeVersion}"
    validateAccessTransformers = true

    def at = project(":Xplat").file('src/main/resources/META-INF/accesstransformer.cfg')
    if(at.exists()) {
        accessTransformers = [at.absolutePath]
    }

    parchment {
        minecraftVersion = mcVersion
        mappingsVersion = parchmentVersion
    }

    runs {
        client {
            client()

            ideName = "McForge Client"
            gameDirectory = file("../run/client")
            logLevel = org.slf4j.event.Level.DEBUG

            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'fml.earlyprogresswindow', 'false'
        }
        server {
            server()

            ideName = "McForge Server"
            gameDirectory = file("../run/server/forge")
            logLevel = org.slf4j.event.Level.DEBUG

            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'fml.earlyprogresswindow', 'false'
        }
    }

    mods {
        "${modId}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly project(":Xplat")

    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")
}

jar {
    finalizedBy("reobfJar")

    manifest.attributes([
            "MixinConfigs": "${modId}.mixins.json,${modId}.forge.mixins.json"
    ])
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = modrinthProjectId

    versionName = "[Forge] MoonlightCore | ${mcVersion}-${version}"
    versionNumber = "${mcVersion}-${version}"
    versionType = "${releaseChannel}"

    if(rootProject.ext.changelogFile.exists()) {
        changelog = rootProject.ext.changelogFile.text
    }

    gameVersions = ["${mcVersion}"]
    loaders = ["forge"]

    uploadFile = jar
}

curseforge {
    apiKey = System.getenv("CURSEFORGE_API_KEY")

    project {
        id = "${curseforgeProjectId}"

        if(rootProject.ext.changelogFile.exists()) {
            changelog = rootProject.ext.changelogFile.text
        }

        releaseType = "${releaseChannel}"

        addGameVersion "Java ${modJavaVersion}"
        addGameVersion "Forge"
        addGameVersion "${mcVersion}"

        mainArtifact(jar) {
            displayName = "[Forge] MoonlightCore | ${mcVersion}-${version}"
        }
    }
}
