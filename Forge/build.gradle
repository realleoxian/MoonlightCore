plugins {
    id 'net.neoforged.moddev.legacyforge'
    id 'com.modrinth.minotaur'
    id 'com.matthewprenger.cursegradle'
}

group = project.modGroup
version = "${mcVersion}-${modVersion}.forge"
base.archivesName = "${modName}"

if(!releaseChannel.equalsIgnoreCase("release")) {
    version += "." + releaseChannel
}


mixin {
    add sourceSets.main, "${modId}.refmap.json"

    config "${modId}.mixins.json"
    config "${modId}.forge.mixins.json"
}

legacyForge {
    version = "${mcVersion}-${forgeVersion}"

    def atFile = project(":Xplat").file("src/main/resources/META-INF/accesstransformer.cfg")
    if(atFile.exists()) {
        validateAccessTransformers = true
        accessTransformers = [atFile]
    }

    runs {
        client {
            client()

            ideName = "ForgeClient"
            gameDirectory = file('../run/client')
            logLevel = org.slf4j.event.Level.DEBUG

            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'fml.earlyprogresswindow', 'false'
        }

        server {
            server()

            ideName = "McForge Server"
            gameDirectory = file("../run/server/forge")
            logLevel = org.slf4j.event.Level.DEBUG

            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'fml.earlyprogresswindow', 'false'
        }
    }

    mods {
        "${modId}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly project(":Xplat")

    implementation(jarJar("io.github.llamalad7:mixinextras-common:0.5.0"))
}

jar {
    finalizedBy("reobfJar")
}

compileJava {
    source project(":Xplat").sourceSets.main.allSource
}

sourcesJar {
    from project(":Xplat").sourceSets.main.allJava
}

processResources {
    from project(":Xplat").sourceSets.main.resources
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.archivesBaseName
            version project.version
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://" + System.getenv("local_maven")
        }
    }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = project.modrinthId

    versionName = "[Forge] MoonlightCore | ${mcVersion}-${version}"
    versionNumber = "${mcVersion}-${version}"
    versionType = "${releaseChannel}"

    if(rootProject.ext.changelogFile.exists()) {
        changelog = rootProject.ext.changelogFile.text
    }

    gameVersions = ["${mcVersion}"]
    loaders = ["forge"]

    uploadFile = jar
}

curseforge {
    apiKey = System.getenv("CURSEFORGE_API_KEY")

    project {
        id = "${curseforgeId}"

        if(rootProject.ext.changelogFile.exists()) {
            changelog = rootProject.ext.changelogFile.text
            changelogType = "markdown"
        }

        releaseType = "${releaseChannel}"

        addGameVersion "Java ${modJavaVersion}"
        addGameVersion "Forge"
        addGameVersion "${mcVersion}"

        mainArtifact(jar) {
            displayName = "[Forge] MoonlightCore | ${mcVersion}-${version}"
        }
    }
}